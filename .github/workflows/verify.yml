# Keeps Prepped and SpareWing honest against the controlled documents in docs/ on every pull request.
name: Verify against the controlled documents

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submission_gate:
        description: "Also run the strict submission gate (fails on placeholders, untested rules and open questions)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the document check compares versions with the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint, including the spec rules in eslint.config.mjs
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Tests, with 100% coverage of packages/core
        run: pnpm test:coverage
      - name: Controlled documents (IDs, trace links, coverage, versions; DOC-000 §8)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm docs:check --base "origin/${{ github.base_ref }}"
          else
            pnpm docs:check
          fi
      - name: Known vulnerabilities in dependencies
        run: pnpm audit --audit-level high

  changes:
    name: Does this change touch safety-critical code? (ADR-051)
    runs-on: ubuntu-24.04
    outputs:
      safety_critical: ${{ steps.diff.outputs.safety_critical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Mutation testing takes 25 to 30 minutes, so it runs only when the safety-critical units
          # in stryker.config.json, or what builds and tests them, change. A manual run, or a base
          # that cannot be found, always runs it.
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            push) base="$BEFORE" ;;
            *) echo "safety_critical=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "safety_critical=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(packages/(core|synth|ai)/src/|stryker\.config\.json$|vitest\.config\.ts$|tsconfig\.json$|package\.json$|packages/[^/]+/package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/verify\.yml$)'; then
            echo "safety_critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "safety_critical=false" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Mutation testing of safety-critical code (ADR-006)
    needs: changes
    if: needs.changes.outputs.safety_critical == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stryker, failing below a mutation score of 80%
        run: pnpm mutation
      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 90

  submission-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.submission_gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release gate (no gaps, no placeholders, safety-critical tested, no open release blockers)
        run: pnpm docs:check --strict
